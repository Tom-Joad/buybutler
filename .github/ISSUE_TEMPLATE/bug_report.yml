name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post passwords, session cookies, addresses or screenshots
        that show your own ratings or photos.** An issue may become public.
        Log lines and settings are almost always enough.
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` field of the `starting` line in the container log.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The `starting` line and the lines around the problem. Redact anything personal first.
      render: json
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: |
        How you run it (Unraid, docker compose), the reverse proxy in front of
        it, the browser and phone, and the settings you changed.
