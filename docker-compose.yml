services:
  buybutler:
    image: ghcr.io/tom-joad/buybutler:latest
    container_name: buybutler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # linuxserver.io conventions: the container starts as root, gives the
      # abc user these IDs and runs the app as abc. Don't set `user:`.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # The database, pictures and backups. Back this folder up.
      - ./config:/config
    ports:
      # Put a reverse proxy with HTTPS in front: the camera in the browser
      # only works over HTTPS.
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
